name = "enet"
description = "Ada Embedded Network Stack"
version = "1.1.0"

authors = ["Stephane Carrez"]
maintainers = ["Stephane Carrez <Stephane.Carrez@gmail.com>", "Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["stcarrez", "reznikmm"]
licenses = "Apache-2.0"
website = "https://github.com/stcarrez/ada-enet"
tags = ["network", "ip", "ipv4", "icmp", "udp", "arp", "dns", "dhcp", "ntp"]
project-files = ["gnat/enet.gpr"]

[configuration]
generate_ada = true
generate_c = false

[configuration.variables]
Default_Random = {type = "Enum", values = ["discrete", "none"], default = "discrete"}
# Selection for Net.Utils.Default_Random:
# * "discrete" - implementation based on Ada.Numerics.Discrete_Random
# * "none" - dummy implementation for app that always overrides Net.Utils.Random

Headroom = {type = "Integer", first = 0, last = 255, default = 0}
# Bytes reserved in each packet buffer before the Ethernet header. A driver
# could put a link layer header there without moving the packet data (see
# Net.Buffers.Get_Buffer_Address). Choose the value so that the driver's
# header is aligned as its DMA requires.

Tailroom = {type = "Integer", first = 0, last = 255, default = 0}
# Extra bytes after the packet data, for instance, for DMA transfers rounded
# up to a block size.
